# 手元(Mac)で、本番と同じイメージ・同じ構成を動かして予行演習するための上書き設定。本番のサーバーでは使わない。
#   cp .env.rehearsal.example .env.rehearsal   (秘密ではない固定の値)
#   docker compose --env-file .env.rehearsal -f compose.prod.yaml -f compose.rehearsal.yaml up -d --build
# 画面: http://localhost:3100  API: http://localhost:8081  (HTTPS・実ドメインだけは、ここでは確かめられない)

services:
    caddy:
        ports: !override
            - '3100:3100'
            - '8081:8081'
