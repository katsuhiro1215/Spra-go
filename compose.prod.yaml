# Spra Go 本番用 Docker Compose(docs/design/2026-10-10-production-env-design.md 4章)。
#
# Spra 専用の Lightsail インスタンス(2GB・東京)に、1つの Compose プロジェクトとして載せる。
# Caddy が 80/443 を持ち、HTTPS を自動で取って、画面(next)と API(app)に振り分ける。
# 将来 Tane・spra-world も同じインスタンスに載せるときは、この Caddy にホスト名のブロックを足す。
#
# 起動(scripts/deploy.sh が行う):
#   docker compose --env-file .env.production -f compose.prod.yaml up -d --build

# 開発用(Laravel Sail)のプロジェクト名 spra-go と別にする。同じだと、予行演習の up/down が開発用のDBコンテナまで作り直して消す
name: spra-go-prod

x-logging: &logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '3'

x-laravel: &laravel
    build:
        context: .
        dockerfile: Dockerfile.prod
        target: app
    image: spra-go-app-prod
    restart: always
    env_file:
        - ${APP_ENV_FILE:-.env.production}
    depends_on:
        mysql:
            condition: service_healthy
    logging: *logging

services:
    caddy:
        build:
            context: .
            dockerfile: Dockerfile.prod
            target: web
        image: spra-go-caddy-prod
        restart: always
        mem_limit: 96m
        ports:
            - '80:80'
            - '443:443'
        environment:
            WEB_SITE: ${WEB_SITE:-go.spra.jp}
            TANE_SITE: ${TANE_SITE:-http://tane.invalid}
            API_SITE: ${API_SITE:-api.go.spra.jp}
            CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@example.com}
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            - app
            - next
        logging: *logging

    app:
        <<: *laravel
        mem_limit: 256m
        volumes:
            - app-storage:/var/www/html/storage

    next:
        build:
            context: .
            dockerfile: Dockerfile.prod
            target: next
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
                NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        image: spra-go-next-prod
        restart: always
        mem_limit: 256m
        logging: *logging

    # Tane(静的ファイルを配るだけの小さな Caddy)。Tane のリポジトリが無い間は作らない(profile: tane。
    # scripts/deploy.sh が、TANE_SRC のフォルダがあるときだけ有効にする)
    tane:
        profiles: ['tane']
        build:
            context: .
            dockerfile: Dockerfile.prod
            target: tane
            additional_contexts:
                tane-src: ${TANE_SRC:-../tane/frontend}
            args:
                NEXT_PUBLIC_SPRA_API_URL: ${TANE_API_URL:-https://api.go.spra.jp}
                NEXT_PUBLIC_TANE_LOGIN: ${TANE_LOGIN:-}
        image: spra-go-tane-prod
        restart: always
        mem_limit: 48m
        logging: *logging

    scheduler:
        <<: *laravel
        mem_limit: 128m
        # 本番イメージ(Alpine)には cron がないので、schedule:run を毎分実行するループにする
        entrypoint: ['sh', '-c']
        command:
            - 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
        volumes:
            - app-storage:/var/www/html/storage

    mysql:
        image: mysql:8.4
        restart: always
        mem_limit: 512m
        command:
            - --innodb-buffer-pool-size=192M
            - --max-connections=40
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 10s
            retries: 6
            timeout: 5s
        logging: *logging

volumes:
    app-storage:
    mysql-data:
    caddy-data:
    caddy-config:
